spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${PRETIUM_DB_URL:jdbc:postgresql://localhost:5432/pretium}
    username: ${PRETIUM_DB_USERNAME:pretium}
    password: ${PRETIUM_DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

pretium:
  security:
    jwt:
      # Em produção este valor deve vir somente de variável de ambiente/secrets manager.
      secret: ${PRETIUM_JWT_SECRET}

logging:
  level:
    root: INFO
    org.example: INFO
  pattern:
    console: "{\"timestamp\": \"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}\", \"level\": \"%p\", \"service\": \"pretium\", \"message\": \"%msg\"}%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: pretium
