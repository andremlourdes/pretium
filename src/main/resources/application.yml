spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  application:
    name: Pretium - Rastreador de Preços em Supermercados

  datasource:
    url: jdbc:h2:mem:pretium;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_updates: true
        order_inserts: true

  h2:
    console:
      enabled: true
      path: /h2-console

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

server:
  port: 8081
  servlet:
    context-path: /

pretium:
  alerts:
    check-interval-ms: ${PRETIUM_ALERT_CHECK_INTERVAL_MS:300000}
  ocr:
    data-path: ${TESSDATA_PREFIX:}
    language: ${PRETIUM_OCR_LANGUAGE:por}
  supermarket-api:
    base-url: ${PRETIUM_SUPERMARKET_API_URL:}

logging:
  level:
    root: INFO
    org.example: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
